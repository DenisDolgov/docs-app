pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{js,ts,jsx,tsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files} && git add {staged_files}
    typecheck-frontend:
      glob: "apps/docs-frontend/**/*.{ts,tsx}"
      run: pnpm --filter @docs-app/docs-frontend typecheck
    typecheck-backend:
      glob: "apps/docs-backend/**/*.ts"
      run: pnpm --filter @docs-app/docs-backend typecheck

commit-msg:
  commands:
    lint-msg:
      run: node scripts/lint-commit.js {1}
